version: 2

models:
  - name: stg_orders
    description: "Cleaned and renamed orders from raw source"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "The id of the customer who made the order"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: ordered_at
        description: "The date and time the order was created"
        tests:
          - not_null
      - name: store_id
        description: "The id of the store where the order was made"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: amount_excluding_tax
        description: "The total amount of the order, excluding tax"
        tests:
          - not_null
      - name: tax_amount
        description: "The total tax amount for the order"
        tests:
          - not_null
      - name: amount_including_tax
        description: "The total amount of the order, including tax"
        tests:
          - not_null