version: 2

models:
  - name: stg_order_items
    description: "Cleaned and renamed order items from raw source"
    columns:
      - name: order_item_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "The order id"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        description: "The product id for the item in the order"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id