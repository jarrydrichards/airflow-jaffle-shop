version: 2

models:
  - name: supplies
    description: "Supplies dimension for use in BI"
    columns:
      - name: supply_id
        description: "Supply ID"
        tests:
          - not_null
      - name: supply_name
        description: "The name of the supply item"
        tests:
          - not_null
      - name: cost
        description: "The cost of the supply item"
        tests:
          - not_null
      - name: is_perishable
        description: "Whether the supply item is perishable"
        tests:
          - not_null
      - name: product_id
        description: "The product ID associated with the supply item"
        tests:
          - not_null
      - name: product_name
        description: "The name of the product associated with the supply item"
        tests:
          - not_null